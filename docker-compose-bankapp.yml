services:
  ollama:
    image: ollama/ollama:latest
    container_name: bankapp-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ollama-net

  ollama-pull-model:
    image: ollama/ollama:latest
    container_name: ollama-pull-model
    environment:
      OLLAMA_HOST: ollama
    volumes:
      - ollama-data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "ollama pull tinyllama"
    networks:
      - ollama-net

volumes:
  ollama-data:

networks:
  ollama-net:
    driver: bridge


echo "MYSQL_ROOT_PASSWORD=Test@123" > .env
echo "MYSQL_DATABASE=bankappdb" >> .env
echo "MYSQL_USER=root" >> .env
echo "MYSQL_PASSWORD=Test@123" >> .env

echo "DB_HOST=mysql" >> .env
echo "DB_PORT=3306" >> .env
echo "DB_NAME=bankappdb" >> .env
echo "DB_USER=root" >> .env
echo "DB_PASSWORD=Test@123" >> .env
echo "OLLAMA_URL=http://${{ secrets.OLLAMA_EC2_HOST }}:11434" >> .env
echo "APP_PORT=8080" >> .env
echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env
echo "DOCKERHUB_PASSWORD=${{ secrets.DOCKERHUB_TOKEN }}" >> .env
echo "IMAGE_TAG=latest" >> .env
