name: CD - Deploy & DAST

on:
  workflow_call:

permissions:
  contents: read

jobs:

  # ============================================================
  # BUILD & PUSH DOCKER IMAGES
  # ============================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # -------------------- BankApp --------------------
      - name: Build BankApp Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest ./bankapp

      - name: Tag BankApp Image with SHA
        run: docker tag ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:${{ github.sha }}

      - name: Push BankApp Images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:${{ github.sha }}

      # -------------------- Ollama --------------------
      - name: Build Ollama Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ollama:latest ./ollama

      - name: Tag Ollama Image with SHA
        run: docker tag ${{ secrets.DOCKERHUB_USERNAME }}/ollama:latest ${{ secrets.DOCKERHUB_USERNAME }}/ollama:${{ github.sha }}

      - name: Push Ollama Images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ollama:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ollama:${{ github.sha }}

  # ============================================================
  # DEPLOY BANKAPP
  # ============================================================
  deploy-bankapp:
    name: Deploy BankApp to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Deployment Directory on BankApp EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p ~/bankapp

      - name: Copy docker-compose.yml to BankApp EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose-bankapp.yml"
          target: "~/bankapp"

      - name: Pull & Deploy BankApp
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/bankapp
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            echo "DB_HOST=${{ secrets.DB_HOST }}" > .env
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "OLLAMA_URL=${{ secrets.OLLAMA_URL }}" >> .env
            docker compose -f docker-compose-bankapp.yml pull
            docker compose -f docker-compose-bankapp.yml up -d

  # ============================================================
  # DEPLOY OLLAMA
  # ============================================================
  deploy-ollama:
    name: Deploy Ollama to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Deployment Directory on Ollama EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p ~/ollama

      - name: Copy docker-compose.yml to Ollama EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose-ollama.yml"
          target: "~/ollama"

      - name: Pull & Deploy Ollama
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/ollama
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose -f docker-compose-ollama.yml pull
            docker compose -f docker-compose-ollama.yml up -d
