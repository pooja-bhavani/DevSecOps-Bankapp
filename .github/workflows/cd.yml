name: CD - Deploy & DAST

on: 
  workflow_call:

permissions:
  contents: read

jobs: 

  # =========================
  # Deploy BankApp to EC2
  # =========================
  push-bankapp-dockerhub:
    name: deploy bankapp to EC2 via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Retry SSH until BankApp EC2 is reachable
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "BankApp EC2 is reachable!"
          retry: 5           # retry up to 5 times
          retry_delay: 15    # wait 15s between retries

      - name: Clean Docker Space (BankApp EC2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: docker system prune -af || true  

      - name: Create Deployment Directory on BankApp EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p ~/bankapp

      - name: Copy docker-compose to BankApp EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose-bankapp.yml
          target: ~/bankapp

      - name: Pull & Deploy BankApp
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/bankapp
            echo "DB_HOST=${{ secrets.DB_HOST }}" > .env
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "OLLAMA_URL=${{ secrets.OLLAMA_URL }}" >> .env
            docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password ${{ secrets.DOCKERHUB_TOKEN }}
            docker compose -f docker-compose-bankapp.yml pull
            docker compose -f docker-compose-bankapp.yml up -d

  # =========================
  # Deploy Ollama to EC2
  # =========================
  pull-ollama-image:
    name: pull/deploy ollama to EC2 via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Cleanup Disk Space on Ollama EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker container prune --force || true
            docker image prune -a --force || true
            docker volume prune --force || true

      - name: Create Deployment Directory on Ollama EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p ~/ollama

      - name: Copy docker-compose to Ollama EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose-ollama.yml
          target: ~/ollama/
          strip_components: 0

      - name: 
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/ollama
            docker compose -f docker-compose-ollama.yml down --remove-orphans || true
            docker rm -f bankapp-ollama || true
            docker container prune -f || true
            docker compose -f docker-compose-ollama.yml pull
            docker compose -f docker-compose-ollama.yml up -d

  # ============================================================
  # GATE 9: DAST - Dynamic Application Security Testing
  # ============================================================
  dast:
    name: DAST - OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true  # Workaround for ZAP's internal artifact upload bug
        with:
          target: 'http://${{ secrets.EC2_HOST }}:8080'
          artifact_name: zapreport
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: report_html.html


