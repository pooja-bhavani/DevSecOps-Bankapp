name: CD - Deploy BankApp & Ollama

on:
  workflow_call:

permissions:
  contents: read
 
jobs:

# ===================================
# 1️⃣ Deploy BankApp
# ===================================
  deploy-bankapp:
    name: Deploy BankApp to EC2 via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Docker Space (BankApp EC2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker system prune -af || true

      - name: Create BankApp Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p ~/bankapp

      - name: Copy BankApp Compose File
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose-bankapp.yml
          target: ~/bankapp/

      - name: Deploy BankApp
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/bankapp

            echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" > .env
            echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env
            echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
            echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env

            echo "DB_HOST=mysql" >> .env
            echo "DB_PORT=3306" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env

            echo "OLLAMA_URL=http://${{ secrets.OLLAMA_EC2_HOST }}:11434" >> .env
            echo "IMAGE_TAG=latest" >> .env

            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            docker compose --env-file .env -f docker-compose-bankapp.yml down || true
            docker compose --env-file .env -f docker-compose-bankapp.yml pull
            docker compose --env-file .env -f docker-compose-bankapp.yml up -d


# ===================================
# 2️⃣ Deploy Ollama
# ===================================
  deploy-ollama:
    name: Pull & Deploy Ollama to EC2 via SSH
    runs-on: ubuntu-latest
    needs: deploy-bankapp

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Docker Space (Ollama EC2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker system prune -af || true

      - name: Create Ollama Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p ~/ollama

      - name: Copy Ollama Compose File
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose-ollama.yml
          target: ~/ollama/

      - name: Deploy Ollama
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/ollama

            docker compose -f docker-compose-ollama.yml down --remove-orphans || true
            docker rm -f bankapp-ollama || true
            docker container prune -f || true

            docker compose -f docker-compose-ollama.yml pull
            docker compose -f docker-compose-ollama.yml up -d
