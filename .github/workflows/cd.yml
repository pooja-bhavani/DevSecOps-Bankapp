name: CD - Deploy & DAST

on:
  workflow_call:

permissions:
  contents: read

jobs:

# =====================================================
# Deploy BankApp to EC2
# =====================================================
  deploy-bankapp:
    name: Deploy BankApp to EC2
    runs-on: ubuntu-latest

    steps:

      # ---------------------------
      # Checkout Repository
      # ---------------------------
      - name: Checkout Repo
        uses: actions/checkout@v4

      # ---------------------------
      # Wait until EC2 reachable
      # ---------------------------
      - name: Wait for EC2 SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: echo "EC2 reachable"
          retry: 5
          retry_delay: 15

      # ---------------------------
      # Clean old Docker resources
      # ---------------------------
      - name: Cleanup Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker system prune -af || true

      # ---------------------------
      # Create deployment folder
      # ---------------------------
      - name: Create Deployment Directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/bankapp

      # ---------------------------
      # Copy docker-compose
      # ---------------------------
      - name: Copy docker-compose
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose-bankapp.yml
          target: ~/bankapp/

      # ---------------------------
      # Deploy Application
      # ---------------------------
      - name: Deploy BankApp
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/bankapp

            # Create .env file
            cat <<EOF > .env
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
            MYSQL_USER=${{ secrets.MYSQL_USER }}
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            OLLAMA_URL=${{ secrets.OLLAMA_URL }}
            EOF

            # Login to DockerHub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
              --username "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin

            # Deploy
            docker compose -f docker-compose-bankapp.yml pull
            docker compose -f docker-compose-bankapp.yml up -d


# =====================================================
# Deploy Ollama to EC2
# =====================================================
  deploy-ollama:
    name: Deploy Ollama
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Cleanup Docker Space
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker container prune -f || true
            docker image prune -a -f || true
            docker volume prune -f || true

      - name: Create Ollama Directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/ollama

      - name: Copy docker-compose
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose-ollama.yml
          target: ~/ollama/

      - name: Deploy Ollama
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/ollama
            docker compose down --remove-orphans || true
            docker compose pull
            docker compose up -d


# =====================================================
# DAST - OWASP ZAP
# =====================================================
  dast:
    name: DAST - OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: deploy-bankapp

    steps:
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true
        with:
          target: "http://${{ secrets.BANKAPP_EC2_HOST }}:8080"
          artifact_name: zapreport
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: report_html.html
