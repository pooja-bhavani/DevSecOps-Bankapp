name: CD - Deploy & DAST

on:
  workflow_call:

permissions:
  contents: read

jobs:

  # ============================================================
  # BUILD & PUSH DOCKER IMAGE
  # ============================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # Build the Docker image (root context)
      - name: Build BankApp Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest .

      - name: Push BankApp Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest

  # ============================================================
  # DEPLOY BANKAPP
  # ============================================================
  deploy-bankapp:
    name: Deploy BankApp to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Create Deployment Directory on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p ~/bankapp

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/bankapp"

      - name: Pull & Deploy BankApp
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/bankapp
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose pull
            docker compose up -d
