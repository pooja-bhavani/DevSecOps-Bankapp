name: CD - Deploy BankApp & Ollama

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-bankapp:
    name: Deploy BankApp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to BankApp EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Checking disk space..."
            df -h /
            
            THRESHOLD=80
            USAGE=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
            if [ $USAGE -ge $THRESHOLD ]; then
              echo "Disk usage is above $THRESHOLD%, cleaning Docker..."
              docker system prune -af
              docker volume prune -f
            fi
            
            mkdir -p ~/bankapp
            echo "Copy docker-compose file..."
            # Copy CD workflow will handle SCP outside this SSH script
            echo "Pull and recreate BankApp containers..."
            docker-compose -f ~/bankapp/docker-compose-bankapp.yml down
            docker-compose -f ~/bankapp/docker-compose-bankapp.yml pull
            docker-compose -f ~/bankapp/docker-compose-bankapp.yml up -d --build

  deploy-ollama:
    name: Deploy Ollama
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Ollama EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Checking disk space..."
            df -h /
            
            THRESHOLD=80
            USAGE=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
            if [ $USAGE -ge $THRESHOLD ]; then
              echo "Disk usage is above $THRESHOLD%, cleaning Docker..."
              docker system prune -af
              docker volume prune -f
            fi
            
            mkdir -p ~/ollama
            echo "Copy docker-compose file..."
            echo "Pull and recreate Ollama container..."
            docker-compose -f ~/ollama/docker-compose-ollama.yml down
            docker-compose -f ~/ollama/docker-compose-ollama.yml pull
            docker-compose -f ~/ollama/docker-compose-ollama.yml up -d --build
