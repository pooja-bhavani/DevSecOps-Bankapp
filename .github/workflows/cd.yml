name: CD - Deploy & DAST

on:
  workflow_call:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:

  # ============================================================
  # DEPLOY BANKAPP & OLLAMA TO EC2
  # ============================================================
  deploy:
    name: Deploy BankApp & Ollama
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to BankApp EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BANKAPP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            mkdir -p ~/bankapp
            cd ~/bankapp

            # Clean up Docker if disk is >80%
            THRESHOLD=80
            USAGE=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
            if [ $USAGE -ge $THRESHOLD ]; then
              echo "Disk usage $USAGE% > $THRESHOLD%, cleaning Docker..."
              docker system prune -af
              docker volume prune -f
            fi

            # Fetch secrets from AWS Secrets Manager
            aws secretsmanager get-secret-value --secret-id bankapp/prod-secrets --query SecretString --output text > secrets.json

            # Write .env
            cat <<EOF > .env
DB_HOST=$(jq -r .DB_HOST secrets.json)
DB_PORT=$(jq -r .DB_PORT secrets.json)
DB_NAME=$(jq -r .DB_NAME secrets.json)
DB_USER=$(jq -r .DB_USER secrets.json)
DB_PASSWORD=$(jq -r .DB_PASSWORD secrets.json)
OLLAMA_URL=$(jq -r .OLLAMA_URL secrets.json)
EOF

            rm secrets.json

            # Create docker-compose-bankapp.yml dynamically
            cat <<EOL > docker-compose-bankapp.yml
version: '3.8'

services:
  bankapp:
    image: ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest
    container_name: bankapp
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
EOL

            docker compose -f docker-compose-bankapp.yml pull
            docker compose -f docker-compose-bankapp.yml up -d --build

      - name: Deploy to Ollama EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            mkdir -p ~/ollama
            cd ~/ollama

            # Clean up Docker if disk is >80%
            THRESHOLD=80
            USAGE=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
            if [ $USAGE -ge $THRESHOLD ]; then
              echo "Disk usage $USAGE% > $THRESHOLD%, cleaning Docker..."
              docker system prune -af
              docker volume prune -f
            fi

            # Create docker-compose-ollama.yml dynamically
            cat <<EOL > docker-compose-ollama.yml
version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: bankapp-ollama
    ports:
      - "11436:11436"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama-pull-model:
    image: ollama/ollama:latest
    container_name: ollama-pull-model
    environment:
      OLLAMA_HOST: ollama
    volumes:
      - ollama-data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "ollama pull tinyllama"
    restart: unless-stopped

volumes:
  ollama-data:
EOL

            docker compose -f docker-compose-ollama.yml pull
            docker compose -f docker-compose-ollama.yml up -d --build

  # ============================================================
  # DAST - Dynamic Application Security Testing
  # ============================================================
  dast:
    name: DAST - OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true
        with:
          target: 'http://${{ secrets.BANKAPP_EC2_HOST }}:8080'
          artifact_name: zapreport
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: report_html.html
