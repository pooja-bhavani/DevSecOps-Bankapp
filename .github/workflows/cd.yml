name: CD - Deploy & DAST

on:
  workflow_call:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:

  # ============================================================
  # GATE 8: DEPLOY
  # ============================================================
  deploy:
    name: Deploy to EC2 via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Deployment Directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p ~/bankapp

      - name: Copy app-tier.yml to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app-tier.yml"
          target: "~/bankapp"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/bankapp

            # Create local .env file for Docker Compose
            echo "MYSQL_HOST=mysql" > .env
            echo "MYSQL_PORT=3306" >> .env
            echo "MYSQL_DATABASE=bankappdb" >> .env
            echo "MYSQL_USER=root" >> .env
            echo "MYSQL_PASSWORD=Test@123" >> .env
            echo "OLLAMA_URL=http://ollama:11434" >> .env
            echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env
            echo "DOCKERHUB_PASSWORD=${{ secrets.DOCKERHUB_TOKEN }}" >> .env
            echo "IMAGE_TAG=latest" >> .env


            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull and Deploy using the app-tier.yml transferred via SCP
            docker compose -f app-tier.yml pull
            docker compose -f app-tier.yml up -d --build

  # ============================================================
  # GATE 9: DAST - Dynamic Application Security Testing
  # ============================================================
  dast:
    name: DAST - OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true  # Workaround for ZAP's internal artifact upload bug
        with:
          target: 'http://${{ secrets.EC2_HOST }}:8080'
          artifact_name: zapreport
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: report_html.html
