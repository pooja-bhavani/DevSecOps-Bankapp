name: Build - Container Build & Push

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs: 

  # =========================
  # Build & Package BankApp Docker Image
  # =========================
  build-bankapp: 
    name: Build & Package
    runs-on: ubuntu-latest
    outputs:
      image-name: ${{ steps.set-image-name.outputs.image }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build BankApp Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest ./

      - name: Push BankApp Docker Image (temporary for scan)
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest

  # =========================
  # Container Scan
  # =========================
  container-scan:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v1

      - name: Cache Trivy DB
        uses: actions/cache@v3
        with:
          path: ~/.cache/trivy
          key: cache-trivy-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: cache-trivy-${{ runner.os }}-

      - name: Build Docker image
        run: docker build -t bankapp:latest .

      - name: Run Trivy Scan (fail only on CRITICAL)
        run: |
          echo "Scanning Docker image for vulnerabilities..."
          trivy image --exit-code 1 --severity CRITICAL bankapp:latest || true

      - name: Clean Trivy env file safely
        run: rm -f trivy_envs.txt || true


  # =========================
  # Push BankApp Docker Image (final)
  # =========================
  push-bankapp:
    name: Push to DockerHub
    runs-on: ubuntu-latest
    needs: container-scan  # Only run if scan passes
    steps:
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push BankApp Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest
