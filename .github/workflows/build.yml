name: CD - Deploy & DAST

on: 
  workflow_call:

permissions:
  contents: read

jobs: 

  # =========================
  # Build & Push BankApp Docker Image
  # =========================
  build-bankapp: 
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build BankApp Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest ./

      - name: Push BankApp Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest

  # =========================
  # Scan BankApp Docker Image
  # =========================
  scan-bankapp:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest
    needs: build-bankapp   # Runs after the build job
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Scan BankApp Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest
          format: table
          exit-code: '1'                  # Fails job if vulnerabilities exist
          severity: CRITICAL,HIGH,MEDIUM  

  # =========================
  # Deploy Ollama to EC2
  # =========================
  pull-ollama-image:
    name: pull/deploy ollama image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Cleanup Disk Space on Ollama EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker container prune --force || true
            docker image prune -a --force || true
            docker volume prune --force || true

      - name: Create Deployment Directory on Ollama EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p ~/ollama

      - name: Copy docker-compose to Ollama EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose-ollama.yml
          target: ~/ollama/
          strip_components: 0

      - name: 
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OLLAMA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/ollama
            docker compose -f docker-compose-ollama.yml down --remove-orphans || true
            docker rm -f bankapp-ollama || true
            docker container prune -f || true
            docker compose -f docker-compose-ollama.yml pull
            docker compose -f docker-compose-ollama.yml up -d
