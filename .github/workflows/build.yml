name: Build - Container Build, Scan & Push

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:

  build-scan-push:
    name: Build → Scan → Push Image
    runs-on: ubuntu-latest

    steps:

      # ---------------------------
      # Checkout Repository
      # ---------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ---------------------------
      # Login to DockerHub
      # ---------------------------
      - name: Login to DockerHub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
          --username "${{ secrets.DOCKERHUB_USERNAME }}" \
          --password-stdin


      # ---------------------------
      # Build Docker Image
      # ---------------------------
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest .


      # ---------------------------
      # Cache Trivy DB
      # ---------------------------
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-


      # ---------------------------
      # Run Trivy Scan
      # ---------------------------
      - name: Run Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          output: trivy-report.txt


      # ---------------------------
      # Upload Scan Report
      # ---------------------------
      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-report
          path: trivy-report.txt


      # ---------------------------
      # Push Image (only if scan passes)
      # ---------------------------
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest
