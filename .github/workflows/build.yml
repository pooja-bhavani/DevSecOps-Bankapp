name: CD - Deploy & DAST

on: 
  workflow_call:

permissions:
  contents: read

jobs: 

  # =========================
  # Build & Push BankApp Docker Image
  # =========================
  build-bankapp: 
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build BankApp Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest ./

      - name: Push BankApp Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest

  # =========================
  # Scan BankApp Docker Image
  # =========================
  scan-bankapp:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest
    needs: build-bankapp   # Runs after the build job
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Scan BankApp Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest
          format: table
          exit-code: '0'                  # Fails job if vulnerabilities exist
          severity: CRITICAL,HIGH,MEDIUM  

  # =========================
  # Push BankApp Docker Image
  # =========================
  push-bankapp:
    name: Push to DockerHub
    runs-on: ubuntu-latest
    needs: scan-bankapp
    steps:
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push BankApp Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest

