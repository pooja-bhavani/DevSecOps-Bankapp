name: Build - Container Build & Push

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:

# =========================
# Build Docker Image
# =========================
  build-bankapp:
    name: Build Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.settag.outputs.tag }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: settag
        run: |
          TAG=${GITHUB_SHA::7}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:$IMAGE_TAG .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:$IMAGE_TAG ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest

      - name: Save Docker Image
        run: |
          docker save ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:$IMAGE_TAG -o bankapp.tar

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bankapp-image
          path: bankapp.tar


# ============================================================
# GATE 6: CONTAINER IMAGE SCAN - Trivy
# ============================================================
  image_scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    needs: build-bankapp

    steps:
      - name: Download Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: bankapp-image

      - name: Load Docker Image
        run: docker load -i bankapp.tar

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:${{ needs.build-bankapp.outputs.image_tag }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          output: trivy-report.txt

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-report
          path: trivy-report.txt


# =========================
# Push Docker Image
# =========================
  push-bankapp:
    name: Push Image to DockerHub
    runs-on: ubuntu-latest
    needs: image_scan

    steps:
      - name: Download Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: bankapp-image

      - name: Load Docker Image
        run: docker load -i bankapp.tar

      - name: Login to DockerHub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
          --username "${{ secrets.DOCKERHUB_USERNAME }}" \
          --password-stdin

      - name: Push Images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:${{ needs.build-bankapp.outputs.image_tag }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest
