name: Build - Container Build & Push

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs: 

  # =========================
  # Build & Package BankApp Docker Image
  # =========================
  build-bankapp: 
    name: Build & Package
    runs-on: ubuntu-latest
    outputs:
      image-name: ${{ steps.set-image-name.outputs.image }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build BankApp Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest ./

      - name: Push BankApp Docker Image (temporary for scan)
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest

  # ============================================================
  # GATE 6: CONTAINER IMAGE SCAN - Trivy
  # ============================================================
  image_scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    needs: build-bankapp
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest
          format: 'table'
          exit-code: '1'         # Fail if Critical/High vulnerabilities are found
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          output: trivy-report.txt

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-report
          path: trivy-report.txt

  # =========================
  # Push BankApp Docker Image (final)
  # =========================
  push-bankapp:
    name: Push to DockerHub
    runs-on: ubuntu-latest
    needs: image_scan  # Only run if scan passes
    steps:
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push BankApp Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/bankapp:latest
