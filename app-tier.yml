services: 
  ollama:
    image: ollama/ollama
    container_name: bankapp-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - bankapp-net
      
  bankapp:
    build: .
    container_name: bankapp
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: ${DB_HOST:-mysql}
      MYSQL_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: ${DB_NAME:-bankappdb}
      MYSQL_USER: ${DB_USER:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Test@123}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    restart: always
    networks:
      - bankapp-net

networks:
  bankapp-net:
    driver: bridge
